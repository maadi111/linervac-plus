# Mosquitto Configuration - Dual Protocol Support
# LinerVac+ MQTT Broker - WebSocket + TCP
# Save this as: /etc/mosquitto/conf.d/linervac.conf (on your Pi/server)

# ═══════════════════════════════════════════════════════════
# Global Settings
# ═══════════════════════════════════════════════════════════

# Allow anonymous connections (development mode)
allow_anonymous true

# Persistence
persistence true
persistence_location /var/lib/mosquitto/

# Logging
log_dest file /var/log/mosquitto/mosquitto.log
log_dest stdout
log_type all

# ═══════════════════════════════════════════════════════════
# Listener 1: WebSocket (for Mobile App, Web Clients)
# ═══════════════════════════════════════════════════════════

listener 443
protocol websockets
# Note: If using Cloudflare proxy, you may need to use port 8443 locally
# and let Cloudflare forward 443 -> 8443

# SSL/TLS for WebSocket (if not using Cloudflare)
# Uncomment these if you have SSL certificates:
# cafile /etc/ssl/certs/ca-certificates.crt
# certfile /etc/mosquitto/certs/fullchain.pem
# keyfile /etc/mosquitto/certs/privkey.pem

# WebSocket path (default is /)
# Your app expects /mqtt, so either:
# 1. Use default and update app to wss://mqtt.linervac.com/
# 2. Or use reverse proxy (nginx/caddy) to route /mqtt -> /

# ═══════════════════════════════════════════════════════════
# Listener 2: TCP MQTT (for Command-Line Tools, Local Access)
# ═══════════════════════════════════════════════════════════

# Plain TCP on port 1883 (local network only)
listener 1883
protocol mqtt
# Bind to localhost only for security (remove to allow external)
# bind_address 127.0.0.1

# ═══════════════════════════════════════════════════════════
# Listener 3: Secure TCP MQTT (for Remote Command-Line Tools)
# ═══════════════════════════════════════════════════════════

# Secure TCP on port 8883 (optional, if you need external TCP access)
# listener 8883
# protocol mqtt
# cafile /etc/ssl/certs/ca-certificates.crt
# certfile /etc/mosquitto/certs/fullchain.pem
# keyfile /etc/mosquitto/certs/privkey.pem

# ═══════════════════════════════════════════════════════════
# Access Control (Optional)
# ═══════════════════════════════════════════════════════════

# For production, configure authentication:
# allow_anonymous false
# password_file /etc/mosquitto/passwd
# acl_file /etc/mosquitto/acl

# ═══════════════════════════════════════════════════════════
# Bridge Configuration (Optional - for connecting multiple brokers)
# ═══════════════════════════════════════════════════════════

# Uncomment to bridge with another broker:
# connection bridge-to-cloud
# address cloud.mqtt.server:8883
# topic linervac/# both 0
# bridge_cafile /etc/ssl/certs/ca-certificates.crt

# ═══════════════════════════════════════════════════════════
# Performance Tuning
# ═══════════════════════════════════════════════════════════

max_connections -1
max_queued_messages 1000
message_size_limit 0

